<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 8px; color: #ffe3e8; background: #612a3544; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 8px; background: #172538; }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; color: #d9e8f7; font-size: 14px; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #71879b; border-radius: 6px; padding: 11px 12px; background: #101a28; color: #ecf4ff; font-size: 16px; }
    button { width: fit-content; border: 0; border-radius: 6px; padding: 10px 14px; background: #8ad8df; color: #10202c; font-weight: 800; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    .auth-status { min-height: 24px; margin: 12px 0 0; }
    .error { color: #ffb3c0; }
    .success { color: #b4e6b4; }
    .hidden { display: none; }
    textarea { width: 100%; min-height: 100px; box-sizing: border-box; border: 1px solid #71879b; border-radius: 6px; padding: 11px 12px; background: #101a28; color: #ecf4ff; font-size: 16px; resize: vertical; }
    .note-actions { display: flex; gap: 8px; margin-top: 12px; }
    .note-editor { margin-top: 26px; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 8px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; display: block; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 서버 인증</div>
    <h1>점령된 자료실</h1>
    <p>메모는 공개 정적 파일이 아닌 서버 데이터베이스에서 불러옵니다. 학습용 가상 자료만 사용합니다.</p>
    <div class="notice">로그인한 A 계정만 인증된 메모 조회를 사용할 수 있습니다.</div>

    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <form id="login-form">
        <label>이메일<input id="email" name="email" type="email" autocomplete="email" required></label>
        <label>비밀번호<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <div id="logged-in" class="hidden">
        <p id="user-email"></p>
        <button id="logout-button" type="button">로그아웃</button>
      </div>
      <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
    </section>

    <section id="note-editor" class="auth note-editor hidden" aria-labelledby="note-editor-title">
      <h2 id="note-editor-title">메모 작성</h2>
      <form id="note-form">
        <input id="note-id" type="hidden">
        <label>제목<input id="note-title" type="text" required></label>
        <label>내용<textarea id="note-body" required></textarea></label>
        <div class="note-actions">
          <button id="save-note-button" type="submit">메모 추가</button>
          <button id="cancel-edit-button" type="button" class="hidden">수정 취소</button>
        </div>
      </form>
    </section>

    <ul id="notes" aria-live="polite"><li>로그인 후 메모를 불러옵니다.</li></ul>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const list = document.querySelector('#notes');
    const loginForm = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const loggedIn = document.querySelector('#logged-in');
    const userEmail = document.querySelector('#user-email');
    const logoutButton = document.querySelector('#logout-button');
    const authStatus = document.querySelector('#auth-status');
    const noteEditor = document.querySelector('#note-editor');
    const noteForm = document.querySelector('#note-form');
    const noteId = document.querySelector('#note-id');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const saveNoteButton = document.querySelector('#save-note-button');
    const cancelEditButton = document.querySelector('#cancel-edit-button');
    let activeSession = null;

    function showAuthStatus(message, kind = '') {
      authStatus.textContent = message;
      authStatus.className = `auth-status ${kind}`.trim();
    }

    async function loadNotes(session) {
      try {
        const headers = session?.access_token
          ? { Authorization: `Bearer ${session.access_token}` }
          : {};
        const response = await fetch('/api/notes', { cache: 'no-store', headers });
        if (response.status === 401) throw new Error('로그인이 필요합니다.');
        if (!response.ok) throw new Error('서버 자료를 읽을 수 없습니다.');
        const data = await response.json();
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        list.replaceChildren(...data.notes.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          const actions = document.createElement('div');
          const editButton = document.createElement('button');
          const deleteButton = document.createElement('button');
          title.textContent = note.title;
          content.textContent = note.body ?? note.content;
          actions.className = 'note-actions';
          editButton.type = 'button';
          editButton.textContent = '수정';
          deleteButton.type = 'button';
          deleteButton.textContent = '삭제';
          editButton.addEventListener('click', () => startEdit(note));
          deleteButton.addEventListener('click', () => deleteNote(note.id));
          actions.append(editButton, deleteButton);
          item.append(title, content, actions);
          return item;
        }));
      } catch (error) {
        const item = document.createElement('li');
        item.textContent = error.message;
        list.replaceChildren(item);
      }
    }

    function startEdit(note) {
      noteId.value = note.id;
      noteTitle.value = note.title;
      noteBody.value = note.body ?? note.content ?? '';
      saveNoteButton.textContent = '메모 저장';
      cancelEditButton.classList.remove('hidden');
      document.querySelector('#note-editor-title').textContent = '메모 수정';
      noteEditor.scrollIntoView({ behavior: 'smooth', block: 'center' });
      noteTitle.focus();
    }

    function resetEditor() {
      noteId.value = '';
      noteTitle.value = '';
      noteBody.value = '';
      saveNoteButton.textContent = '메모 추가';
      cancelEditButton.classList.add('hidden');
      document.querySelector('#note-editor-title').textContent = '메모 작성';
    }

    async function deleteNote(id) {
      if (!activeSession?.access_token) return;
      const response = await fetch(`/api/notes/${encodeURIComponent(id)}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${activeSession.access_token}` }
      });
      if (!response.ok) {
        showAuthStatus('메모를 삭제할 수 없습니다.', 'error');
        return;
      }
      resetEditor();
      await loadNotes(activeSession);
    }

    let supabase;
    try {
      const configResponse = await fetch('/api/auth-config', { cache: 'no-store' });
      const config = await configResponse.json();
      if (!configResponse.ok) throw new Error(config.detail || 'Supabase 로그인을 사용할 수 없습니다.');
      supabase = createClient(config.url, config.publishableKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
    } catch (error) {
      loginButton.disabled = true;
      showAuthStatus(error.message, 'error');
    }

    if (supabase) {
      const { data: { session } } = await supabase.auth.getSession();
      const renderSession = currentSession => {
        if (currentSession?.user) {
          activeSession = currentSession;
          loginForm.classList.add('hidden');
          loggedIn.classList.remove('hidden');
          noteEditor.classList.remove('hidden');
          userEmail.textContent = `로그인됨: ${currentSession.user.email || currentSession.user.id}`;
          showAuthStatus('로그인 상태입니다.', 'success');
          loadNotes(currentSession);
        } else {
          activeSession = null;
          loginForm.classList.remove('hidden');
          loggedIn.classList.add('hidden');
          noteEditor.classList.add('hidden');
          resetEditor();
          userEmail.textContent = '';
          list.replaceChildren();
          showAuthStatus('로그아웃 상태입니다.');
        }
      };
      renderSession(session);
      supabase.auth.onAuthStateChange((_event, currentSession) => renderSession(currentSession));

      loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        loginButton.disabled = true;
        showAuthStatus('로그인 중입니다.');
        const email = document.querySelector('#email').value.trim();
        const password = document.querySelector('#password').value;
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        loginButton.disabled = false;
        if (error) showAuthStatus(error.message, 'error');
        else {
          document.querySelector('#password').value = '';
          showAuthStatus('로그인되었습니다.', 'success');
        }
      });

      logoutButton.addEventListener('click', async () => {
        logoutButton.disabled = true;
        const { error } = await supabase.auth.signOut();
        logoutButton.disabled = false;
        if (error) showAuthStatus(error.message, 'error');
        else showAuthStatus('로그아웃되었습니다.');
      });

      cancelEditButton.addEventListener('click', resetEditor);
      noteForm.addEventListener('submit', async event => {
        event.preventDefault();
        if (!activeSession?.access_token) return;
        saveNoteButton.disabled = true;
        const payload = { title: noteTitle.value.trim(), body: noteBody.value };
        const editingId = noteId.value;
        const url = editingId
          ? `/api/notes/${encodeURIComponent(editingId)}`
          : '/api/notes';
        const response = await fetch(url, {
          method: editingId ? 'PUT' : 'POST',
          headers: {
            Authorization: `Bearer ${activeSession.access_token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });
        saveNoteButton.disabled = false;
        if (!response.ok) {
          const result = await response.json().catch(() => ({}));
          showAuthStatus(result.error || '메모를 저장할 수 없습니다.', 'error');
          return;
        }
        resetEditor();
        await loadNotes(activeSession);
      });
    }

  </script>
</body>
</html>
