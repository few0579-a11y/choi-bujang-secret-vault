<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오프라인 | 비밀 자료실</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101a28; color: #ecf4ff; font-family: system-ui, sans-serif; }
    main { max-width: 520px; padding: 24px; }
    p { color: #bfd0e5; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>지금은 오프라인입니다</h1>
    <p>자료실의 메모는 서버가 로그인과 기기 승인을 확인한 뒤에만 보여 주기 때문에, 오프라인에서는 메모를 보여 주지 않습니다. 이 기기에 저장해 둔 메모도 없습니다.</p>
    <p>인터넷에 다시 연결되면 이 화면을 새로 고쳐 주세요.</p>
  </main>
</body>
</html>
